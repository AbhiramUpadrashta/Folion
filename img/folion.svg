<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Folion">
  <defs>
    <linearGradient id="fp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8aa6ff"/><stop offset=".55" stop-color="#5b72f0"/><stop offset="1" stop-color="#7c5cf0"/></linearGradient>
    <linearGradient id="ff" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6ecff"/><stop offset="1" stop-color="#b9c6ff"/></linearGradient>
    <radialGradient id="fb1" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffdbe7"/><stop offset=".45" stop-color="#ff8fb1"/><stop offset="1" stop-color="#df4f86"/></radialGradient>
    <radialGradient id="fb2" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#d8fff3"/><stop offset=".45" stop-color="#5fd9b6"/><stop offset="1" stop-color="#21a383"/></radialGradient>
    <filter id="fs" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3a4bc8" flood-opacity=".28"/></filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="#ffffff"/>
